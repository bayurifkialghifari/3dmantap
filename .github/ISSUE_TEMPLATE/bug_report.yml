name: Bug report
description: Report a reproducible problem in 3DMantap.
title: 'bug: '
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the expected behavior and actual result. Do not include private data or credentials.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the app route, product/model and the steps that trigger the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, OS, Bun version, browser and relevant screenshots or sanitized logs.
