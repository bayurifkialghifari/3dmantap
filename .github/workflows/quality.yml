name: Quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: 3dmantap
        ports: [3306:3306]
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DATABASE_URL: mysql://root:ci-password@127.0.0.1:3306/3dmantap
      BETTER_AUTH_SECRET: ci-only-random-secret-32-characters-long
      ADMIN_EMAIL: admin@3dmantap.local
      ADMIN_PASSWORD: ci-admin-password-strong
      APP_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate && bun run db:seed
      - run: bun run lint && bun run format:check && bun run typecheck && bun run docs:check
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - run: bun run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
